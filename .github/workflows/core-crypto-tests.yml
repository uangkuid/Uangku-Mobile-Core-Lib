name: Core Crypto Tests

on:
  push:
    paths:
      - 'libs/core_crypto/**'
      - '.github/workflows/core-crypto-tests.yml'
  pull_request:
    paths:
      - 'libs/core_crypto/**'
      - '.github/workflows/core-crypto-tests.yml'

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test (JVM host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core_crypto host tests
        run: ./gradlew :libs:core_crypto:testAndroidHostTest --no-daemon --stacktrace

  android-instrumented-test:
    name: Android Instrumented Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run core_crypto instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :libs:core_crypto:connectedAndroidDeviceTest --no-daemon --stacktrace

  ios-test:
    name: iOS Simulator Test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core_crypto iOS simulator tests
        run: ./gradlew :libs:core_crypto:iosSimulatorArm64Test --no-daemon --stacktrace
